title: Home

tabs:

  # Hero
  hero:
    label:
      en: Hero
      es: Portada
    icon: image
    columns:

      # Foreground — follows the design top-to-bottom:
      # logo, bottle name, bottle, hero text, signature
      main:
        width: 2/3
        sections:

          brand:
            type: fields
            fields:

              logo:
                label:
                  en: Logo
                  es: Logo
                type: files
                max: 1
                multiple: false
                layout: cards
                query: page.images
                uploads: image
                translate: false
                image:
                  back: white
                width: 1/2

              signature:
                label:
                  en: Signature
                  es: Firma
                type: files
                max: 1
                multiple: false
                layout: cards
                query: page.images
                uploads: image
                translate: false
                image:
                  back: white
                width: 1/2

              bottles:
                label:
                  en: Bottles
                  es: Botellas
                type: structure
                translate: false
                help:
                  en: Add one or more bottles. One is picked at random every time the page loads.
                  es: Agrega una o más botellas. Se elige una al azar cada vez que carga la página.
                columns:
                  image:
                    width: 1/3
                  name:
                    width: 2/3
                fields:
                  image:
                    label:
                      en: Bottle image
                      es: Imagen de la botella
                    type: files
                    max: 1
                    multiple: false
                    query: page.images
                    uploads: image
                    image:
                      back: white
                  name:
                    label:
                      en: Bottle name
                      es: Nombre de la botella
                    type: text

              heroText:
                label:
                  en: Hero text
                  es: Texto de hero
                type: textarea
                size: medium

      # Backdrop assets — background and illustration
      sidebar:
        width: 1/3
        sticky: true
        sections:

          backdrop:
            type: fields
            fields:

              background:
                label:
                  en: Background
                  es: Fondo
                type: files
                max: 1
                multiple: false
                layout: cards
                query: page.images
                uploads: image
                translate: false
                image:
                  back: white

              illustration:
                label:
                  en: Illustration
                  es: Ilustración
                type: files
                max: 1
                multiple: false
                layout: cards
                query: page.images
                uploads: image
                translate: false
                image:
                  back: white

          files:
            label:
              en: All files
              es: Archivos
            type: files

  # Intro
  intro:
    label:
      en: Intro
      es: Intro
    icon: text
    fields:
      introTitle:
        label:
          en: Title
          es: Título
        type: text
      introText:
        label:
          en: Text
          es: Texto
        type: textarea
        size: large

  # Gallery
  gallery:
    label:
      en: Gallery
      es: Galería
    icon: image
    fields:
      gallery:
        label:
          en: Images
          es: Imágenes
        type: files
        multiple: true
        layout: cards
        query: page.images
        uploads: image
        translate: false
        image:
          back: white

  # Meet the place
  place:
    label:
      en: Meet the place
      es: Conoce el lugar
    icon: home
    columns:

      one:
        width: 1/2
        sections:
          columnOne:
            type: fields
            fields:
              placeTextOne:
                label:
                  en: Text
                  es: Texto
                type: textarea
              placeTitleOne:
                label:
                  en: Title
                  es: Título
                type: text
              placeImageOne:
                label:
                  en: Image
                  es: Imagen
                type: files
                max: 1
                multiple: false
                layout: cards
                query: page.images
                uploads: image
                translate: false
                image:
                  back: white

      two:
        width: 1/2
        sections:
          columnTwo:
            type: fields
            fields:
              placeTextTwo:
                label:
                  en: Text
                  es: Texto
                type: textarea
              placeTitleTwo:
                label:
                  en: Title
                  es: Título
                type: text
              placeImageTwo:
                label:
                  en: Image
                  es: Imagen
                type: files
                max: 1
                multiple: false
                layout: cards
                query: page.images
                uploads: image
                translate: false
                image:
                  back: white

  # The lake
  lake:
    label:
      en: The lake
      es: El lago
    icon: image
    fields:
      lakeTitle:
        label:
          en: Title
          es: Título
        type: text
      lakeSubtitle:
        label:
          en: Subtitle
          es: Subtítulo
        type: text
      lakeText:
        label:
          en: Text
          es: Texto
        type: textarea
      lakeIllustration:
        label:
          en: Illustration
          es: Ilustración
        type: files
        max: 1
        multiple: false
        layout: cards
        query: page.images
        uploads: image
        translate: false
        image:
          back: white

  # Distillery
  distillery:
    label:
      en: Distillery
      es: Destilería
    icon: image
    fields:
      distilleryImage:
        label:
          en: Image
          es: Imagen
        type: files
        max: 1
        multiple: false
        layout: cards
        query: page.images
        uploads: image
        translate: false
        image:
          back: white
      distilleryTitle:
        label:
          en: Title
          es: Título
        type: text
      distilleryText:
        label:
          en: Text
          es: Texto
        type: textarea

  # SEO
  seo:
    label:
      en: SEO
      es: SEO
    icon: search
    columns:

      main:
        width: 2/3
        fields:
          metaTitle:
            label:
              en: Meta title
              es: Meta título
            type: text
            help:
              en: Shown in search results and browser tabs. Falls back to the page title when empty.
              es: Se muestra en los resultados de búsqueda y en las pestañas del navegador. Si se deja vacío, se usa el título de la página.
          metaDescription:
            label:
              en: Meta description
              es: Meta descripción
            type: textarea
            size: small
            counter: true
            maxlength: 160
            help:
              en: Short summary shown in search results. Aim for 150–160 characters.
              es: Resumen corto que se muestra en los resultados de búsqueda. Procura 150–160 caracteres.
          ogHeadline:
            type: headline
            label:
              en: Open Graph (social sharing)
              es: Open Graph (redes sociales)
          ogTitle:
            label:
              en: Open Graph title
              es: Título Open Graph
            type: text
            help:
              en: Title shown when this page is shared on Facebook, WhatsApp, etc. Falls back to the meta title when empty.
              es: Título que se muestra al compartir esta página en Facebook, WhatsApp, etc. Si se deja vacío, se usa el meta título.
          ogDescription:
            label:
              en: Open Graph description
              es: Descripción Open Graph
            type: textarea
            size: small
            counter: true
            maxlength: 200
            help:
              en: Description shown when this page is shared. Falls back to the meta description when empty.
              es: Descripción que se muestra al compartir esta página. Si se deja vacío, se usa la meta descripción.

      sidebar:
        width: 1/3
        fields:
          ogImage:
            label:
              en: Open Graph image
              es: Imagen Open Graph
            type: files
            max: 1
            multiple: false
            query: page.images
            uploads: image
            translate: false
            image:
              back: white
            help:
              en: Recommended 1200×630px. Falls back to the page's main image when empty.
              es: Recomendado 1200×630px. Si se deja vacío, se usa la imagen principal de la página.
          noIndex:
            label:
              en: Hide from search engines
              es: Ocultar de buscadores
            type: toggle
            default: false
            translate: false
